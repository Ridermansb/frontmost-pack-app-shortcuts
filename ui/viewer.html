<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App shortcuts</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --fg: #1a1a1a;
        --muted: #5c6570;
        --card: #ffffff;
        --line: #e2e5ea;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12141a;
          --fg: #e8eaed;
          --muted: #9aa3ad;
          --card: #1b1f27;
          --line: #2a303a;
          --accent: #6ea8fe;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        padding: 16px;
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 16px;
      }
      .meta a {
        color: var(--accent);
      }
      .note {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 12px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      section h2 {
        font-size: 13px;
        margin: 0;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
      }
      tr:first-child th,
      tr:first-child td {
        border-top: 0;
      }
      kbd {
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 6px;
        white-space: nowrap;
      }
      .error {
        color: #b42318;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main id="root">
      <p class="meta">Loading shortcuts…</p>
    </main>
    <script>
      (function () {
        var root = document.getElementById('root')
        var params = new URLSearchParams(location.search)
        var appKey = params.get('app') || ''

        function platformKey() {
          var ua = navigator.userAgent || ''
          if (/Windows/i.test(ua)) return 'win'
          if (/Linux/i.test(ua)) return 'linux'
          return 'mac'
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
        }

        function keyFor(shortcut, platform) {
          return (
            shortcut[platform] ||
            shortcut.mac ||
            shortcut.win ||
            shortcut.linux ||
            '—'
          )
        }

        function render(data, resolvedFrom) {
          var platform = platformKey()
          var html = ''
          html += '<h1>' + escapeHtml(data.title || data.app || 'Shortcuts') + '</h1>'
          html +=
            '<p class="meta">App key: <code>' +
            escapeHtml(appKey || '(none)') +
            '</code> · file: <code>' +
            escapeHtml(resolvedFrom) +
            '</code>'
          if (data.source) {
            html +=
              ' · <a href="' +
              escapeHtml(data.source) +
              '" target="_blank" rel="noreferrer">source</a>'
          }
          html += '</p>'

          if (data.notes && data.notes.length) {
            html += '<div class="note">'
            data.notes.forEach(function (n) {
              html += '<div>' + escapeHtml(n) + '</div>'
            })
            html += '</div>'
          }

          var sections = data.sections
          if (!sections && data.shortcuts) {
            sections = [{ name: 'Shortcuts', shortcuts: data.shortcuts }]
          }
          ;(sections || []).forEach(function (section) {
            html += '<section><h2>' + escapeHtml(section.name) + '</h2>'
            html +=
              '<table><thead><tr><th>Action</th><th>' +
              escapeHtml(platform.toUpperCase()) +
              '</th></tr></thead><tbody>'
            ;(section.shortcuts || []).forEach(function (sc) {
              html +=
                '<tr><td>' +
                escapeHtml(sc.action) +
                '</td><td><kbd>' +
                escapeHtml(keyFor(sc, platform)) +
                '</kbd></td></tr>'
            })
            html += '</tbody></table></section>'
          })

          root.innerHTML = html
        }

        function fail(err) {
          root.innerHTML =
            '<h1>Shortcuts</h1><p class="error">' +
            escapeHtml(String(err && err.message ? err.message : err)) +
            '</p><p class="meta">Add a JSON file under <code>apps/</code> and map it in <code>apps/index.json</code>.</p>'
        }

        function loadJson(rel) {
          return fetch(new URL(rel, location.href)).then(function (res) {
            if (!res.ok) throw new Error('Failed to load ' + rel + ' (' + res.status + ')')
            return res.json()
          })
        }

        loadJson('../apps/index.json')
          .then(function (index) {
            var aliases = (index && index.aliases) || {}
            var fallback = (index && index.fallback) || '_default.json'
            var tryFiles = []
            if (appKey && aliases[appKey]) tryFiles.push(aliases[appKey])
            if (appKey) tryFiles.push(appKey + '.json')
            tryFiles.push(fallback)

            function tryNext(i) {
              if (i >= tryFiles.length) {
                return Promise.reject(
                  new Error('No shortcuts JSON found for ' + (appKey || '(empty)')),
                )
              }
              var file = tryFiles[i]
              return loadJson('../apps/' + file).then(
                function (data) {
                  return { data: data, file: file }
                },
                function () {
                  return tryNext(i + 1)
                },
              )
            }

            return tryNext(0)
          })
          .then(function (result) {
            render(result.data, result.file)
          })
          .catch(fail)
      })()
    </script>
  </body>
</html>
